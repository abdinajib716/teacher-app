<!doctype html>
<html lang="so">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>Offline · Teacher Attendance</title>
    <style>
      :root { --bg: #f6f4ee; --card: #fffefb; --ink: #1a1917; --muted: #625d55; --rule: #e3ddd0; --blue: #1d3f6e; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #12110f; --card: #1a1916; --ink: #ece7dc; --muted: #a29b8e; --rule: #2d2a25; --blue: #93b4e6; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
      main { width: 100%; max-width: 380px; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 24px; border-radius: 8px; background: var(--blue); color: var(--bg);
        display: grid; place-items: center; }
      h1 { font-family: "IBM Plex Serif", Georgia, serif; font-size: 26px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); line-height: 1.5; margin: 0; font-size: 15px; }
      hr { border: 0; border-top: 1px solid var(--rule); margin: 22px 0; }
      .en h1 { font-size: 20px; }
      button { margin-top: 28px; width: 100%; height: 48px; border: 0; border-radius: 6px; background: var(--blue);
        color: var(--bg); font: 600 15px system-ui, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0" />
          <path d="M3 3l18 18" />
        </svg>
      </div>
      <section>
        <h1>Internet ma jiro</h1>
        <p>App-kan wuxuu u baahan yahay internet si uu u soo raro oo u kaydiyo xaadiritaanka. Ku xirmo oo isku day mar kale.</p>
      </section>
      <hr />
      <section class="en" lang="en">
        <h1>You’re offline</h1>
        <p>This app needs an internet connection to load and save attendance. Reconnect and try again.</p>
      </section>
      <button type="button" onclick="location.reload()">Isku day mar kale · Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload() })
    </script>
  </body>
</html>
